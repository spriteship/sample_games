<!doctype html><html><head><meta charset="utf-8"><title>UI Pack preview</title><style>body{background:#17212d;color:#e8eef4;font:16px system-ui;margin:24px}label{display:block;margin:12px 0}canvas{background:repeating-conic-gradient(#263544 0% 25%,#1c2b3b 0% 50%) 0/20px 20px;max-width:100%}textarea{display:block;width:360px;max-width:90vw;height:90px}input{margin-left:12px}#error{color:#ff9c9c}</style></head><body><h1>UI Pack preview</h1><p>Serve this folder over local HTTP. This browser preview is separate from native engine verification.</p><select id="component" aria-label="Component"></select><label>Value<input id="value" type="range" min="0" max="1" step=".01" value=".5"></label><label>Width<input id="width" type="number" min="1" max="4096"></label><label>Height<input id="height" type="number" min="1" max="4096"></label><label>Title<input id="title" type="text"></label><label>Content<textarea id="content"></textarea></label><div id="actionLabels"></div><label>Button text<input id="label" type="text"></label><label>Button text size<input id="labelFontSize" type="number" min="8" max="96"></label><label>Button state<select id="state"></select></label><label>Indicator radius<input id="radius" type="number" min="1" max="2048"></label><label>Heading<input id="heading" type="range" min="0" max="360" step="1"></label><canvas id="canvas"></canvas><p id="error"></p><script type="module">import {loadUiPack,renderUiComponent} from './ui-runtime.js'; const $=id=>document.getElementById(id); try{const pack=await loadUiPack();for(const c of pack.manifest.components){const o=document.createElement('option');o.value=c.id;o.textContent=c.name;$('component').append(o)}const current=()=>pack.manifest.components.find(c=>c.id===$('component').value);function reset(){const c=current().activeRevision.configuration;$('width').value=c.width;$('height').value=c.height;$('content').value=c.panel?.content||'';$('title').value=c.panel?.title||'';$('actionLabels').replaceChildren();for(const [index,action] of (c.panel?.actionButtons||[]).entries()){const row=document.createElement('label');row.textContent='Dialogue button '+(index+1);const input=document.createElement('input');input.value=action.label;input.oninput=draw;row.append(input);$('actionLabels').append(row)}$('label').value=c.label||'';$('labelFontSize').value=(c.labelFont||current().activeRevision.styleGuide.bodyFont).size;$('state').replaceChildren();for(const state of Object.keys(c.states||{normal:''})){const option=document.createElement('option');option.value=state;option.textContent=state;$('state').append(option)}$('state').value=c.selectedState||'normal';$('radius').value=c.indicator?.radius||1;$('heading').value=c.indicator?.heading||0;draw()}function draw(){renderUiComponent($('canvas'),current(),pack.images,{value:Number($('value').value),width:Number($('width').value),height:Number($('height').value),content:$('content').value,actionLabels:Array.from($('actionLabels').querySelectorAll('input'),input=>input.value),title:$('title').value,label:$('label').value,labelFontSize:Number($('labelFontSize').value),state:$('state').value,radius:Number($('radius').value),heading:Number($('heading').value)})}$('component').onchange=reset;for(const id of ['value','width','height','title','content','label','labelFontSize','state','radius','heading'])$(id).oninput=draw;reset()}catch(e){$('error').textContent=String(e)}</script></body></html>
