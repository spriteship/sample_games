[preset.0]
name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/spriteship/*.json,assets/spriteship/**/*.json"
exclude_filter="tools/*,.spriteship/*,assets/spriteship/**/source-*,assets/spriteship/**/metadata-*,assets/spriteship/**/README.md,assets/spriteship/**/SKILL.md"
export_path="dist/index.html"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/custom_html_shell=""
html/head_include="<meta name=\"description\" content=\"Emberhold: The Last Hearth — a hand-painted fantasy settlement strategy adventure.\"><style>html,body{background:#101b18}#status{background:#101b18;color:#eedfc0}#status-splash{object-fit:cover!important;opacity:.38}#status:before{content:'EMBERHOLD';position:absolute;top:39%;z-index:1;font:clamp(32px,6vw,72px) Georgia,serif;letter-spacing:.09em}#status:after{content:'THE LAST HEARTH · LOADING YOUR VALLEY';position:absolute;top:54%;z-index:1;font:12px Arial,sans-serif;letter-spacing:.18em}#status-progress{accent-color:#c89b5a;z-index:2;bottom:27%;width:min(420px,60%);height:5px}#status-notice{z-index:3}</style>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
